<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Găsește Casa · Аренда квартир и продажа в Кишинёве · Chirie Chișinău · без комиссии</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #1b2733);
  --hint: var(--tg-theme-hint-color, #8a97a5);
  --brand: #0f9d8f;
  --brand-dark: #0a6e63;
  --accent: var(--tg-theme-button-color, var(--brand));
  --accent-text: var(--tg-theme-button-text-color, #fff);
  --card: var(--tg-theme-secondary-bg-color, #f4f6f8);
  --line: rgba(27, 39, 51, .08);
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .08);
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 24px; }
header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(180%) blur(10px); padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; box-shadow: var(--shadow); }
h1 { font-size: 18px; font-weight: 700; letter-spacing: -.2px; display: flex; align-items: center; gap: 8px; }
h1 .count { font-size: 12px; color: var(--hint); font-weight: 500; margin-left: auto; }
h1 .tag { font-size: 11px; font-weight: 600; color: var(--brand-dark); background: color-mix(in srgb, var(--brand) 12%, transparent); border-radius: 999px; padding: 3px 9px; }
.filters { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; padding: 8px 15px; border-radius: 999px; background: var(--card); color: var(--text); border: 1px solid var(--line); font-size: 13px; font-weight: 500; cursor: pointer; transition: .15s; }
.chip.on { background: var(--brand); color: #fff; border-color: transparent; box-shadow: 0 2px 8px color-mix(in srgb, var(--brand) 40%, transparent); }
select, input[type=number] { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 14px; }
.addcta { display: block; width: 100%; margin-top: 10px; padding: 10px 14px; border-radius: 11px; background: var(--brand); color: #fff; border: none; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px color-mix(in srgb, var(--brand) 30%, transparent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.grid { display: flex; flex-direction: column; gap: 14px; padding: 14px 16px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; position: relative; box-shadow: var(--shadow); transition: transform .12s; }
.card:active { transform: scale(.99); }
.card img { width: 100%; height: 200px; object-fit: cover; display: block; background: var(--card); }
.card .noimg { width: 100%; height: 140px; display: flex; align-items: center; justify-content: center; color: var(--hint); font-size: 34px; background: var(--card); }
.card .body { padding: 12px 14px 14px; }
.price { font-size: 19px; font-weight: 800; letter-spacing: -.3px; color: var(--text); }
.price small { font-size: 12px; font-weight: 500; color: var(--hint); }
.meta { font-size: 13px; color: var(--hint); margin-top: 3px; }
.badges { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
.badge { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 8px; background: rgba(20, 28, 36, .62); color: #fff; backdrop-filter: blur(4px); }
.badge.boost { background: linear-gradient(135deg, #f7b733, #f5820b); color: #3a2600; }
.empty { text-align: center; color: var(--hint); padding: 56px 28px; }
.empty svg { width: 76px; height: 76px; opacity: .9; margin-bottom: 16px; }
.empty b { display: block; margin-bottom: 6px; color: var(--text); font-size: 18px; }
.empty p { font-size: 14px; line-height: 1.5; max-width: 260px; margin: 0 auto; }
.btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 13px; background: var(--accent); color: var(--accent-text); font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; }
.btn.sec { background: var(--card); color: var(--text); margin-top: 8px; }
.footer { text-align: center; color: var(--hint); font-size: 12px; padding: 22px 16px 4px; }
/* detail sheet */
.sheet { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; transform: translateY(100%); transition: transform .22s ease; }
.sheet.open { transform: translateY(0); }
.sheet .top { position: sticky; top: 0; background: var(--bg); padding: 10px 14px; display: flex; align-items: center; gap: 10px; z-index: 2; }
.sheet .back { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--text); }
.carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 0; }
.carousel img { width: 100%; flex: 0 0 100%; scroll-snap-align: center; height: 260px; object-fit: cover; }
.detail { padding: 14px; }
.detail h2 { font-size: 22px; }
.detail .sub { color: var(--hint); margin: 4px 0 12px; }
.detail .desc { margin: 12px 0; white-space: pre-wrap; }
.detail .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.fact { background: var(--card); border-radius: 10px; padding: 10px; font-size: 13px; }
.fact b { display: block; font-size: 15px; }
.actions { padding: 0 14px 30px; }
.contact-info { margin-top: 10px; font-size: 17px; font-weight: 600; text-align: center; }
.contacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.contactlink { display: inline-flex; align-items: center; padding: 9px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 13px; font-weight: 600; }
.contactlink:active { transform: scale(.97); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Găsește Casa">
      <defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0fb2a0"/><stop offset="1" stop-color="#0a6e63"/></linearGradient></defs>
      <rect width="64" height="64" rx="14" fill="url(#gc)"/>
      <path d="M32 15 L49 30 H45 V47 a2 2 0 0 1-2 2 H21 a2 2 0 0 1-2-2 V30 H15 Z" fill="#fff"/>
      <circle cx="32" cy="34" r="4.2" fill="#0a6e63"/>
      <path d="M30.4 37 h3.2 l1.6 8 h-6.4 Z" fill="#0a6e63"/>
    </svg>
    <h1>Găsește Casa <span class="tag">Доска</span> <span class="count" id="count"></span></h1>
  </div>
  <button class="addcta" onclick="toBot('add')">➕ Добавить объявление · бесплатно, 2 минуты</button>
  <div class="filters">
    <div class="chips" id="dealChips">
      <button class="chip on" data-deal="">Все</button>
      <button class="chip" data-deal="rent">🏠 Аренда</button>
      <button class="chip" data-deal="sale">💰 Продажа</button>
    </div>
    <div class="row">
      <select id="district"><option value="">Все районы</option></select>
      <select id="ptype">
        <option value="">Любой тип</option><option value="apartment">Квартира</option>
      </select>
      <select id="rooms">
        <option value="">Комнат: все</option><option value="1">1</option><option value="2">2</option>
        <option value="3">3+</option>
      </select>
      <input type="number" id="priceMax" placeholder="Цена max">
    </div>
  </div>
</header>

<main class="grid" id="grid"></main>
<div class="empty" id="empty" style="display:none">
  <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 28 L32 12 L52 28"/><path d="M18 25 V50 H46 V25"/><circle cx="32" cy="34" r="3.4"/><path d="M30.8 37 h2.4 l1.2 6 h-4.8 Z"/>
  </svg>
  <b>Здесь пока пусто</b>
  <p>По этим фильтрам объявлений ещё нет. Разместите своё — бесплатно и за 2 минуты.</p>
  <div style="margin-top:18px"><button class="btn" onclick="toBot('add')">➕ Разместить объявление</button></div>
</div>
<button class="btn sec" id="more" style="display:none; margin:0 16px">Показать ещё</button>
<div class="footer">Găsește Casa · аренда и продажа · без комиссии · контакт всегда на карточке<br><span onclick="toBot('add')" style="text-decoration:underline;cursor:pointer">➕ Добавить своё объявление бесплатно →</span></div>

<div class="sheet" id="sheet">
  <div class="top"><button class="back" onclick="closeSheet()">←</button> <b id="sheetTitle">Объявление</b></div>
  <div id="sheetBody"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const INIT = tg?.initData || "";
const MY_ID = tg?.initDataUnsafe?.user?.id || 0;
const BOT_URL = "{{BOT_URL}}"; // replaced by webapp/app.py on serve (config-driven, no hardcode)
const DISTRICTS = ["Центр","Ботаника","Буюканы","Рышкановка","Чеканы","Дурлешты","Кодры","Стэучень","Кондрица","Бачой","Криково","Сынджера","Тохатин","Бубуечь","Другое"];

const state = { deal:"", district:"", ptype:"", rooms:"", price_max:"", page:1, total:0 };
const $ = (id) => document.getElementById(id);

async function api(path, opts={}) {
  const headers = Object.assign({"X-Init-Data": INIT}, opts.headers||{});
  const r = await fetch(path, Object.assign({headers}, opts));
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function params() {
  const p = new URLSearchParams();
  for (const k of ["deal","district","ptype","rooms","price_max"]) if (state[k]) p.set(k, state[k]);
  p.set("page", state.page);
  return p.toString();
}

function cardHtml(it) {
  const img = it.photos.length ? `<img src="${it.photos[0]}" loading="lazy">` : `<div class="noimg">🏠</div>`;
  const badges = `<div class="badges">${it.boosted?'<span class="badge boost">🚀 Boost</span>':''}<span class="badge">${esc(it.deal_label)}</span></div>`;
  const facts = [it.rooms?it.rooms+"к":"", it.area?it.area+" м²":"", it.floor?it.floor+(it.floors?"/"+it.floors:"")+" эт":""].filter(Boolean).join(" · ");
  return `<div class="card" onclick="openDetail(${it.id})">${badges}${img}
    <div class="body"><div class="price">${it.price} <small>${esc(it.currency)}/мес</small></div>
    <div class="meta">${esc(it.ptype_label)} · ${esc(it.district)}${facts?" · "+facts:""}</div></div></div>`;
}

async function load(append=false) {
  try {
    const data = await api("/api/listings?"+params());
    state.total = data.total;
    const html = data.items.map(cardHtml).join("");
    $("grid").insertAdjacentHTML(append ? "beforeend" : "afterbegin", html);
    if (!append) $("grid").innerHTML = html;
    $("empty").style.display = data.total ? "none" : "block";
    $("more").style.display = data.items.length && data.page*data.per < data.total ? "block" : "none";
  } catch(e) { $("empty").style.display="block"; }
  const s = await api("/api/stats").catch(()=>({active:0}));
  $("count").textContent = s.active ? s.active+" объявл." : "";
}

function toBot(startParam) {
  // tg.openTelegram does NOT exist - only openTelegramLink, and ?start= allows [A-Za-z0-9_-] only.
  const url = BOT_URL + "?start=" + encodeURIComponent(startParam);
  // 1. the recommended WebApp API: it opens t.me links in Telegram natively
  if (tg && typeof tg.openTelegramLink === "function") { tg.openTelegramLink(url); return; }
  // 2. last-resort: an invisible anchor click. window.open is silently blocked by a lot of
  //    embedded webviews (Telegram mobile, iOS), and it also loses the user gesture.
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// owner-set public channels -> (button label, url builder). mirrors keyboards.py:_CONTACT_CHANNELS
// Viber is skipped - viber:// is not a valid Telegram inline URL and browsers strip it too.
const _CHANNELS = {
  telegram:  ["\uD83D\uDCAC Telegram",  (v) => v.startsWith("http") ? v : "https://t.me/" + v.replace(/^@/, "")],
  instagram: ["\uD83D\uDCF7 Instagram", (v) => v.startsWith("http") ? v : "https://instagram.com/" + v.replace(/^@/, "")],
  facebook:  ["\uD83D\uDCD8 Facebook",  (v) => v.startsWith("http") ? v : "https://facebook.com/" + v.replace(/^@/, "")],
  whatsapp:  ["\uD83D\uDFE2 WhatsApp",  (v) => "https://wa.me/" + v.replace(/\D/g, "")],
  site:      ["\uD83D\uDD17 Сайт",       (v) => v.startsWith("http") ? v : "https://" + v],
};
function contactsHtml(contacts) {
  const parts = [];
  for (const [k, raw] of Object.entries(contacts || {})) {
    const ch = _CHANNELS[k]; const v = String(raw || "").trim();
    if (!ch || !v) continue;
    const url = ch[1](v); if (!url) continue;
    parts.push(`<a class="contactlink" href="${esc(url)}" target="_blank" rel="noopener">${ch[0]}</a>`);
  }
  return parts.length ? `<div class="contacts">${parts.join("")}</div>` : "";
}

async function openDetail(id) {
  let it;
  try { it = await api("/api/listing/"+id); } catch { return; }
  $("sheetTitle").textContent = `${it.deal_label} · ${it.ptype_label}`;
  const gal = it.photos.length ? `<div class="carousel">${it.photos.map(p=>`<img src="${p}">`).join("")}</div>` : "";
  const facts = [
    it.rooms ? `<div class="fact"><b>${it.rooms}</b>комнат</div>` : "",
    it.area ? `<div class="fact"><b>${it.area}</b>м²</div>` : "",
    it.floor ? `<div class="fact"><b>${it.floor}${it.floors?"/"+it.floors:""}</b>этаж</div>` : "",
    `<div class="fact"><b>${it.views}</b>просмотров</div>`,
  ].join("");
  $("sheetBody").innerHTML = `${gal}<div class="detail">
    <h2>${it.price} <small>${esc(it.currency)}${it.deal==="rent"?"/мес":""}</small> ${it.boosted?'<span class="badge boost" style="position:static">🚀 Boost</span>':''}</h2>
    <div class="sub">📍 ${esc(it.district)}</div>
    <div class="facts">${facts}</div>
    ${it.description?`<div class="desc">${esc(it.description)}</div>`:""}
    ${contactsHtml(it.contacts)}
  </div>
  <div class="actions">
    <button class="btn" id="contactBtn" onclick="revealContact(${it.id})">📞 Показать контакт</button>
    <div class="contact-info" id="contactInfo"></div>
    ${it.owner_tg === MY_ID ? `<button class="btn sec" onclick="toBot('boost_${it.id}')">\u{1F680} Поднять объявление (Boost)</button>` : ""}
    <button class="btn sec" onclick="closeSheet()">← К списку</button>
  </div>`;
  $("sheet").classList.add("open");
  history.scrollRestoration = "manual";
}

async function revealContact(id) {
  $("contactBtn").textContent = "…";
  try {
    const c = await api(`/api/listing/${id}/contact`, { method: "POST" });
    let html = "";
    if (c.phone) html += `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`;
    if (c.tg) html += (html?" · ":"")+`<a href="${esc(c.tg)}">Telegram</a>`;
    $("contactInfo").innerHTML = html || "Контакт не указан";
    $("contactBtn").textContent = "📞 Показать ещё раз";
  } catch(e) { $("contactBtn").textContent = "📞 Показать контакт"; }
}

function closeSheet(){ $("sheet").classList.remove("open"); }

// filters wiring
$("dealChips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  document.querySelectorAll("#dealChips .chip").forEach(c=>c.classList.remove("on"));
  b.classList.add("on"); state.deal = b.dataset.deal; state.page = 1; load();
});
$("district").innerHTML += DISTRICTS.map(d=>`<option>${d}</option>`).join("");
["district","ptype","rooms","priceMax"].forEach(id => $(id).addEventListener("change", () => {
  state.district = $("district").value; state.ptype = $("ptype").value;
  state.rooms = $("rooms").value; state.price_max = $("priceMax").value;
  state.page = 1; load();
}));
$("more").addEventListener("click", () => { state.page++; load(true); });

if (location.hash.startsWith("#listing=")) openDetail(+location.hash.split("=")[1]);
load();
</script>
</body>
</html>
